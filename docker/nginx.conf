server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

	# Assets hashés SvelteKit (/_app/immutable/…) : cache long
	location /_app/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# WebAssembly : MIME obligatoire pour instantiateStreaming
	location ~* \.wasm$ {
		default_type application/wasm;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Shell SPA (auth optionnelle insérée par l'entrypoint via include)
	location = /index.html {
		include /etc/nginx/auth.conf;
		add_header Cache-Control "no-cache";
	}

	# SPA : tout chemin inconnu → shell
	location / {
		try_files $uri $uri/ /index.html;
	}
}