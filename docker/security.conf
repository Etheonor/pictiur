# Durcissement + isolement cross-origin.
# COOP/COEP rendent le contexte cross-origin-isolé → SharedArrayBuffer dispo
# (débloque les encodeurs AVIF/JXL multithread, l'app est 100 % same-origin).
# NB : comme toute location qui pose un `add_header` écrase ceux du serveur,
# ce fichier est inclus dans chaque location qui définit son propre Cache-Control.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header X-Content-Type-Options "nosniff" always;
