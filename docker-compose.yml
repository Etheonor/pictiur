services:
  pictiur:
    # Build locally from the Dockerfile (no need to publish the image).
    # To use the published image (CI → ghcr.io/etheonor/pictiur:latest) instead, replace with:
    #   image: ghcr.io/etheonor/pictiur:latest
    # and remove the `build` block.
    build: .
    image: pictiur:local
    container_name: pictiur
    restart: unless-stopped
    ports:
      - '3002:80'
    environment:
      # Optional basic auth: leave empty = open access
      - USERNAME=
      - PASSWORD=
