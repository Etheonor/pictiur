server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

	include /etc/nginx/security.conf;

	# Hashed SvelteKit assets (/_app/immutable/…): long cache
	location /_app/ {
		include /etc/nginx/security.conf;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# WebAssembly: required MIME for instantiateStreaming
	location ~* \.wasm$ {
		include /etc/nginx/security.conf;
		default_type application/wasm;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Service worker: never cached (must re-download the new sw.js)
	location = /sw.js {
		include /etc/nginx/security.conf;
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# SPA shell (optional auth inserted by the entrypoint via include)
	location = /index.html {
		include /etc/nginx/auth.conf;
		include /etc/nginx/security.conf;
		add_header Cache-Control "no-cache";
	}

	# SPA: any unknown path → shell
	location / {
		try_files $uri $uri/ /index.html;
	}
}