# Hardening + cross-origin isolation.
# COOP/COEP make the context cross-origin-isolated → SharedArrayBuffer available
# (unlocks the multithread AVIF/JXL encoders; the app is 100% same-origin).
# NB: any location that sets its own `add_header` overrides the server-level ones,
# so this file is included in every location that defines its own Cache-Control.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header X-Content-Type-Options "nosniff" always;